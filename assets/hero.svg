<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">ZIP Inspector — visual mark</title><desc id="desc">Original animated illustration for zip-inspector; motion is decorative and respects reduced-motion preferences.</desc><defs><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#E9C46A"/><stop offset="1" stop-color="#263238"/></linearGradient></defs><style>.float{transform-box:fill-box;transform-origin:center;animation:float 4.8s ease-in-out infinite}.dash{animation:dash 7s linear infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes dash{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){.float,.dash{animation:none}}</style><rect width="900" height="280" rx="22" fill="#263238"/><path d="M0 220C170 160 250 300 420 210S700 150 900 205V280H0Z" fill="url(#wash)" opacity=".22"/><g><path d="M600 70H750L790 110V210H600Z" fill="#37474F" stroke="#E9C46A" stroke-width="3"/><path d="M750 70V110H790" fill="none" stroke="#E9C46A" stroke-width="3"/><path d="M670 70V210M700 70V210M730 70V210" stroke="#E76F51" stroke-width="5" stroke-dasharray="10 8"/><path d="M640 140H750" stroke="#E9C46A" stroke-width="3"/><g class="float"><path d="M810 48L828 80H792Z" fill="#E76F51"/><path d="M810 58V68M810 73V75" stroke="#263238" stroke-width="3" stroke-linecap="round"/></g></g><text x="64" y="104" fill="#F8FAFC" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">ZIP-INSPECTOR</text><text x="64" y="145" fill="#F8FAFC" font-family="Georgia,serif" font-size="31">ZIP Inspector</text><text x="64" y="178" fill="#E76F51" font-family="Arial,sans-serif" font-size="14">Small tool. Clear signal.</text></svg>